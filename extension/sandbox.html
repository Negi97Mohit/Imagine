<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; width: 100%; height: 100%; }
  #root { position: absolute; inset: 0; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  #loading-bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, #b8410e 0%, #ea580c 50%, #b8410e 100%);
    background-size: 200% 100%;
    animation: locked-image-loading 1.2s infinite linear;
    z-index: 999999;
    opacity: 1;
    transition: opacity 0.3s ease;
  }
  @keyframes locked-image-loading {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  #loading-bar.hidden {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="loading-bar"></div>
  <div id="error-badge" style="display:none;position:absolute;bottom:8px;left:8px;background:rgba(185,28,28,0.92);color:#fff;font-family:Inter,system-ui,sans-serif;font-size:9.5px;font-weight:600;padding:4px 8px;border-radius:3px;z-index:999999;backdrop-filter:blur(4px);pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,0.3);">
    ⚠️ Interaction Error
  </div>
  <div id="root"></div>
  <canvas id="stage"></canvas>
  <style id="user-css"></style>
  <script src="templates.js"></script>
  <script src="sandbox.js"></script>
</body>
</html>
